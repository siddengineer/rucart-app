# Application Configuration
spring.application.name=rucart-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (Environment configured with sensible local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rucart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Serialization
spring.jackson.serialization.indent-output=true

# JWT Security Configuration
rucart.jwt.secret=${JWT_SECRET:rucart_super_secret_jwt_key_that_is_long_enough_for_sha256_security_at_least_32_bytes_long}
rucart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Payment Gateway Configuration
payment.gateway.key.id=${PAYMENT_KEY_ID:gw_key_default}
payment.gateway.key.secret=${PAYMENT_SECRET:mock_gateway_secret_key}
payment.gateway.webhook.secret=${PAYMENT_WEBHOOK_SECRET:mock_webhook_secret_key}
rucart.payment.cod.enabled=${COD_ENABLED:true}

# MSG91 OTP & Verification Configuration
msg91.auth.key=${MSG91_AUTH_KEY:}
msg91.widget.id=${MSG91_WIDGET_ID:366b646c4b74353831343330}
msg91.sender.id=${MSG91_SENDER_ID:RUCART}
msg91.template.id=${MSG91_TEMPLATE_ID:}
msg91.verify.access.token.url=https://control.msg91.com/api/v5/widget/verifyAccessToken
msg91.otp.url=https://control.msg91.com/api/v5/otp
