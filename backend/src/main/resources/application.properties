# Application Configuration
spring.application.name=rucart-backend
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (Environment configured with sensible local defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rucart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Serialization
spring.jackson.serialization.indent-output=true

# JWT Security Configuration
rucart.jwt.secret=${JWT_SECRET:rucart_super_secret_jwt_key_that_is_long_enough_for_sha256_security_at_least_32_bytes_long}
rucart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay & Payment Gateway Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SJw1ZGxwH879yz}
razorpay.key.secret=${RAZORPAY_SECRET:6qnJJ5DSorMKth5L8u0RigXJ}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:rucart_webhook_secret_key_12345}
rucart.payment.cod.enabled=${COD_ENABLED:true}
